[project]
name = "geospatial-risk-mapper"
version = "0.1.0"
description = "Geospatial flood risk prediction and mapping with GeoPandas and Streamlit."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Luke Gardiner" }]
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "streamlit>=1.58.0",
    "uvicorn[standard]>=0.48.0",
    "geopandas>=0.14.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.20.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_risk"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, N: naming, UP: pyupgrade,
# B: bugbear, SIM: simplify, C4: comprehensions
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["N806", "SIM108", "E501"]  # Allow X, X_train naming in ML code; allow if-else blocks; allow long lines in Pydantic

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = true
reportAttributeAccessIssue = false
reportArgumentType = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportCallIssue = false
reportReturnType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
